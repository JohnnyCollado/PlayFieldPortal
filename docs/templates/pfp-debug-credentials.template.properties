# PlayFieldPortal debug credentials: TEMPLATE. Never put real values in this file (it is tracked).
#
# Loaded from Settings > Artwork > Debug > Load Credentials File (debug builds only).
#
# 1. Copy this file and name the copy pfp-debug-credentials.properties (.gitignore ignores that
#    name), or keep the copy outside the repo. Fill in the copy only.
# 2. Put the copy on the device: adb push pfp-debug-credentials.properties /sdcard/Download/
# 3. Open Load Credentials File and pick it. Delete the copy from the device afterwards.
#
# Rules:
# - Leave a value blank to skip it: that credential stays exactly as it is on the device.
# - Pairs (IGDB, ScreenScraper, RetroAchievements, Steam) load only when BOTH halves are filled.
# - Misspelled keys and half-filled pairs are reported after loading rather than silently ignored.
# - Secrets are sealed with the device keystore, the same as typing them into Settings.
# - Files over 64 KB are refused.

# ── Artwork ─────────────────────────────────────────────────────────────────

# steamgriddb.com/profile/preferences/api
steamgriddb.apiKey=

# Requested from thegamesdb.net
thegamesdb.apiKey=

# dev.twitch.tv/console/apps (IGDB uses Twitch app credentials)
igdb.clientId=
igdb.clientSecret=

# Your screenscraper.fr account (optional; raises the rate limit and daily quota)
screenscraper.username=
screenscraper.password=

# ── Achievements ────────────────────────────────────────────────────────────

# retroachievements.org/settings (Web API Key)
retroachievements.username=
retroachievements.apiKey=

# SteamID64 (17 digits) or your custom profile URL name
steam.id=
# steamcommunity.com/dev/apikey
steam.apiKey=
