# ── Gradle daemon & execution ────────────────────────────────────────────────
org.gradle.daemon=true
org.gradle.daemon.idletimeout=10800000
org.gradle.parallel=true
org.gradle.tooling.parallel=true
org.gradle.caching=true
# disableMemoryMapping stops the JVM mmapping jars/zips. On Windows a mapped file stays locked
# after the reader closes it, so a later clean or dependency swap fails with "cannot delete".
# This is a live platform workaround, not a version-compatibility bypass.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding\=UTF-8 -Dsun.zip.disableMemoryMapping\=true -Djdk.nio.zipfs.disableMemoryMapping\=true

# ── Android ──────────────────────────────────────────────────────────────────
android.useAndroidX=true

# ── Kotlin ───────────────────────────────────────────────────────────────────
kotlin.code.style=official

# ── Encoding ─────────────────────────────────────────────────────────────────
# Pin the daemon's charset and locale so builds are byte-identical regardless of the
# machine's system locale.
systemProp.file.encoding=UTF-8
systemProp.sun.jnu.encoding=UTF-8
systemProp.user.language=en
systemProp.user.country=US
